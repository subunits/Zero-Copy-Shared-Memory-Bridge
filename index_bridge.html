<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Bare-Metal Shared Struct Demo — Bridge Class (Tidy Console)</title>
  <style>
    #web-console {
      background-color: #1e1e1e;
      color: #d4d4d4;
      font-family: 'Courier New', Courier, monospace;
      padding: 15px;
      border-radius: 6px;
      max-height: 400px;
      overflow-y: auto;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .log-line {
      margin-bottom: 6px;
      border-bottom: 1px solid #2d2d2d;
      padding-bottom: 4px;
    }
    .log-line .timestamp {
      color: #858585;
      margin-right: 10px;
    }
  </style>
</head>
<body>

  <h2>Application Output (Bridge Class)</h2>
  <pre id="web-console"></pre>

  <script>
    (function() {
      const consoleDisplay = document.getElementById('web-console');
      const originalLog = console.log;

      console.log = function(...args) {
        originalLog.apply(console, args);

        const message = args.map(arg => {
          if (typeof arg === 'object') {
            return JSON.stringify(arg, null, 2);
          }
          return arg;
        }).join(' ');

        const logLine = document.createElement('div');
        logLine.className = 'log-line';
        
        const timestamp = new Date().toLocaleTimeString();
        logLine.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;

        consoleDisplay.appendChild(logLine);
        consoleDisplay.scrollTop = consoleDisplay.scrollHeight;
      };
    })();
    console.log("Console bridge ready. Awaiting WebAssembly runtime...");
    window.Module = window.Module || {};
  </script>

  <script src="shared_struct.js"></script>
  <script src="packet_bridge.js"></script>
  <script src="main.js"></script>

  <script>
    if (window.Module && window.Module.runtimeInitialized && typeof window.Module.onRuntimeInitialized === 'function') {
        window.Module.onRuntimeInitialized();
    }
  </script>
</body>
</html>
